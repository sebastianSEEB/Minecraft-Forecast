name: Bazaar signals

# Misprices, correlations and suggestions for the bazaar (tools/bz_signals.py → market/bzsignals.py):
# Hypixel live bazaar + SkyCofl 7-day history + NEU compression recipes. Publishes data/bz_signals.json
# to GitHub Pages; the mod shows it in ERP → Signals. Your PC collector's own hourly data replaces it
# when it has 24+ hours.

on:
  workflow_dispatch:
    inputs:
      products:
        description: "How many of the most traded products to analyse"
        default: "260"
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: gh-pages-positions
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python tests/test_bzsignals.py
      - name: Get NEU recipes
        run: git clone -q --depth 1 https://github.com/NotEnoughUpdates/NotEnoughUpdates-REPO.git neu
      - name: Find misprices and correlations
        run: set -o pipefail; python tools/bz_signals.py out neu "${{ inputs.products || '260' }}" | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: bz-signals-inputs
          path: out/
          retention-days: 3
      - name: Publish bz_signals.json to gh-pages
        run: |
          for attempt in 1 2 3; do
            rm -rf site && git clone -q --depth 2 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site || exit 1
            mkdir -p site/data && cp out/bz_signals.json site/data/
            cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bz_signals.json
            if [ "$(git log -1 --format=%s)" = "positions update" ]; then git commit -q --amend -m "positions update"; \
            else git commit -q -m "positions update"; fi
            if git push -q --force-with-lease origin gh-pages; then exit 0; fi
            cd .. && sleep 10
          done
          exit 1
