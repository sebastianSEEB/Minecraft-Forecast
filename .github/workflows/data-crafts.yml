name: Data · craft flips

# Every 3 h: craft flips from NEU recipes, the Hypixel bazaar and auction house, and SkyCofl volume.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  crafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone -q --depth 1 https://github.com/NotEnoughUpdates/NotEnoughUpdates-REPO.git neu
      - run: set -o pipefail; python tools/craft_flips.py neu out | tee -a $GITHUB_STEP_SUMMARY
      - run: |
          tools/pages.sh clone site
          mkdir -p site/data && cp out/craft_flips.json site/data/
          tools/pages.sh push site
