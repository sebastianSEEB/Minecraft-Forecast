name: Data · bazaar history and forecasts

# Hourly: one bazaar snapshot into the rolling 14-day history, 7-day charts per product, and
# 1 h / 6 h / 24 h forecasts (tools/bz_history.py → market/forecast.py).

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  bazaar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_forecast.py
      - run: tools/pages.sh clone site
      - run: set -o pipefail; python tools/bz_history.py site 2000 | tee -a $GITHUB_STEP_SUMMARY
      - run: tools/pages.sh push site
