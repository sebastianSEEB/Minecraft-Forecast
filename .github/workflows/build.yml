name: Build mod

on:
  push:
    paths: ["mod/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1.2", "26.2", "26.3"]
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"      # Loom needs a Java 25 JVM; the jar targets Java 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Minecraft ${{ matrix.mc }}
        if: matrix.mc != '1.21.11'
        run: |
          cp versions/build.gradle.26x build.gradle
          grep -vE '^(minecraft_version|loader_version|loom_version|fabric_api_version|mc_range)=' gradle.properties > gp.tmp
          cat versions/${{ matrix.mc }}/versions.properties >> gp.tmp
          mv gp.tmp gradle.properties
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Collect jar
        run: |
          mkdir -p ../out
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          name="${{ matrix.mc }}"; [ "$name" = "26.1.2" ] && name="26.1"
          ver=$(grep '^version=' gradle.properties | cut -d= -f2)
          cp "$jar" ../out/notenoughflips-$ver+mc$name.jar
      - uses: actions/upload-artifact@v4
        with:
          name: notenoughflips-mc${{ matrix.mc }}
          path: out/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest jars/*.jar --repo "$REPO" --target "${{ github.sha }}" \
            --title "Not Enough Flips (latest build)" \
            --notes "Pick the jar for your Minecraft version and put it in your mods folder with Fabric API. mc26.1 = 26.1 / 26.1.1 / 26.1.2, mc26.2 = 26.2.x, mc26.3 = 26.3.x, mc1.21.11 = 1.21.11."
